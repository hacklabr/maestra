# Fluxo evals — NIGHTLY. Full matrix + LLM-as-judge (tier-2, versioned rubric
# in lib/rubric.md), cache OFF (--no-cache via npm run eval:nightly).
# Detects model drift: fresh calls every night.
description: "Fluxo evals — nightly (full matrix + tier-2 judge)"

providers:
  - id: file://providers/maestra-agent.mjs

tests:
  - file://scenarios/anti-bypass.yaml
  - file://scenarios/j8-guard.yaml
  - file://scenarios/j1-triage.yaml
  - file://scenarios/j2-resume.yaml
  - file://scenarios/fm-vinculantes.yaml
  - file://scenarios/j9-panel-shell.yaml
  - file://scenarios/r02-welcoming-language.yaml
  - file://scenarios/r15-qa-session.yaml
  - file://scenarios/instructions-loading.yaml

# Tier-2: versioned rubric applied to ALL scenarios (binary per item).
# The judge is promptfoo's default provider — configure via env
# (OPENAI_API_KEY or PROMPTFOO_*/equivalent local provider).
defaultTest:
  assert:
    - type: llm-rubric
      value: file://lib/rubric.md
