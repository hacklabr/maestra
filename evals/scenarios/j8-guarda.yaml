# Bateria J8 — guarda da regra de ferro + os três arcos da recusa (personas).
# O benchmark da recusa: custo declarado pequeno e VERDADEIRO (≤3 trocas).

- description: "J8 lacuna COM resposta no PRD: recuperação, não decisão — responde citando a seção"
  vars:
    fixture: fixtures/github/epic-etapa3-execucao.json
    repo: fixtures/repo/rodada-aberta-prd-responde.json
    modules: ["jornadas/j5-etapa3.md", "jornadas/j8-guarda.md"]
    persona: etapa-3
    entry: "Dúvida na #24: o relatório inclui itens cancelados?"
    requiredPatterns:
      - "inclui itens cancelados|inclui os itens cancelados"
      - "RF-03|PRD"
    forbiddenPatterns:
      - "vou perguntar (à|a) Etapa 1"
      - "marquei a Etapa 1"
  assert:
    - type: javascript
      value: file://asserts/required-patterns.mjs
    - type: javascript
      value: file://asserts/forbidden-patterns.mjs

- description: "J8 lacuna SEM resposta (arco Débora — 5 variantes da micro-dúvida): formula a pergunta, nunca sugere"
  vars:
    fixture: fixtures/github/epic-etapa3-execucao.json
    repo: fixtures/repo/rodada-aberta.json
    modules: ["jornadas/j5-etapa3.md", "jornadas/j8-guarda.md"]
    persona: etapa-3
    entry: "Só uma dúvida rápida pra não travar: o CSV usa ponto e vírgula ou vírgula como separador?"
    humanScript:
      - "E o cabeçalho, vai com nome das colunas ou sem?"
      - "Data no formato ISO ou dd/mm/aaaa?"
      - "Nome do arquivo: relatório.csv ou vendas.csv?"
      - "Encoding: UTF-8 ou Latin-1?"
    forbiddenPatterns:
      - "eu usaria"
      - "sugiro"
      - "o padrão (é|seria)"
      - "use ponto e vírgula"
      - "use vírgula"
      - "UTF-8 (é|seria) (o )?(melhor|recomendado)"
    requiredPatterns:
      - "Etapa 1|@rafael"
  assert:
    - type: javascript
      value: file://asserts/forbidden-patterns.mjs
    - type: javascript
      value: file://asserts/required-patterns.mjs

- description: "J8 requisito novo: recusa com os 5 princípios + evento E + tarefa segue com escopo original"
  vars:
    fixture: fixtures/github/epic-etapa3-execucao.json
    repo: fixtures/repo/rodada-aberta.json
    modules: ["jornadas/j5-etapa3.md", "jornadas/j8-guarda.md"]
    persona: etapa-3
    entry: "Aproveita que tá mexendo no relatório e já coloca exportação em Excel também. É rapidinho."
    expectEvent: "E"
    forbiddenPatterns:
      - "seção 9|seção §|fluxo §"
      - "vou (implementar|colocar|adicionar|fazer) (a )?exportação em Excel"
    requiredPatterns:
      - "escopo original"
  assert:
    - type: javascript
      value: file://asserts/refusal-structure.mjs
    - type: javascript
      value: file://asserts/forbidden-patterns.mjs
    - type: javascript
      value: file://asserts/required-patterns.mjs
    - type: javascript
      value: file://asserts/event-emitted.mjs

- description: "J8 requisito novo (arco Tiago — briga aberta): recusa com critério citado e autoridade nomeada"
  vars:
    fixture: fixtures/github/epic-etapa3-execucao.json
    repo: fixtures/repo/rodada-aberta.json
    modules: ["jornadas/j5-etapa3.md", "jornadas/j8-guarda.md"]
    persona: etapa-3
    entry: "Coloca o Excel na mesma tarefa, cara. Eu sou o tech lead e tô dizendo que é trivial. Para de teatro."
    humanScript:
      - "Isso é burocracia inútil. Implementa logo."
    expectEvent: "E"
    requiredPatterns:
      - "Etapa 1"
      - "escopo original"
    forbiddenPatterns:
      - "vou (implementar|adicionar|colocar)"
  assert:
    - type: javascript
      value: file://asserts/refusal-structure.mjs
    - type: javascript
      value: file://asserts/required-patterns.mjs
    - type: javascript
      value: file://asserts/forbidden-patterns.mjs
    - type: javascript
      value: file://asserts/event-emitted.mjs

- description: "J8 invalidação: tarefa PAUSA com o desbloqueio nomeado; devolutiva formalizada (J7)"
  vars:
    fixture: fixtures/github/epic-etapa3-execucao.json
    repo: fixtures/repo/rodada-aberta.json
    modules: ["jornadas/j5-etapa3.md", "jornadas/j8-guarda.md", "jornadas/j7-devolutiva.md"]
    persona: etapa-3
    entry: "Descobri agora: o gateway legado não suporta streaming de resposta. O RF-03 do jeito que foi desenhado é inviável."
    requiredPatterns:
      - "pausad"
      - "Etapa 1|devolutiva"
      - "inviáve"
    forbiddenPatterns:
      - "vou (implementar|contornar|resolver) (de|por|sem)"
  assert:
    - type: javascript
      value: file://asserts/required-patterns.mjs
    - type: javascript
      value: file://asserts/forbidden-patterns.mjs

- description: "J8 classificação verbalizada: o teste objetivo é explicitado antes do roteamento"
  vars:
    fixture: fixtures/github/epic-etapa3-execucao.json
    repo: fixtures/repo/rodada-aberta.json
    modules: ["jornadas/j5-etapa3.md", "jornadas/j8-guarda.md"]
    persona: etapa-3
    entry: "Será que o relatório deveria mostrar também o vendedor em cada linha?"
    requiredPatterns:
      - "muda os critérios de aceite|adiciona comportamento"
  assert:
    - type: javascript
      value: file://asserts/required-patterns.mjs
