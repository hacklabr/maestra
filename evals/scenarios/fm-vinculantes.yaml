# Binding scenarios from dogfood #1 (Guardian V-4 + consensus): FM-04, FM-06, FM-21.
# FM-13 is already covered in maestra-report (report-core.ts) + J2 B6.

- description: "FM-06 pre-epic abandonment: a new session does NOT hallucinate a previous conversation; names the restart honestly"
  vars:
    fixture: fixtures/github/triagem-limpa.json
    repo: fixtures/repo/repo-sem-team.json
    modules: ["journeys/j1-triage.md"]
    persona: stage-1
    entry: "I want to resume that conversation about the report export we started yesterday. Where did we leave off?"
    requiredPatterns:
      - "I (don't|cannot) (find|have) (any )?record|I have no (memory|record)|I can't find"
      - "restart|start (over|from scratch)|5 minutes"
    forbiddenPatterns:
      - "as we were saying"
      - "continuing from where we left off"
      - "from (our )?last (conversation|session)"
      - "as we agreed"
  assert:
    - type: javascript
      value: file://asserts/required-patterns.mjs
    - type: javascript
      value: file://asserts/forbidden-patterns.mjs

- description: "FM-04 no permission to list collaborators: partial map, minimal roles — NEVER blocks the epic"
  vars:
    fixture: fixtures/github/sem-permissao-colaboradores.json
    repo: fixtures/repo/repo-sem-team.json
    modules: ["journeys/j1-triage.md"]
    persona: stage-1
    entry: "Adjust the shipping rule at checkout — a small change, 1 day, just that part."
    humanScript:
      - "Confirm Minimal."
      - "Create it with whatever roles we have."
    expectedCallOrder:
      - "exec:.*(members|collaborators)"
      - "exec:.*issue create"
    requiredPatterns:
      - "partial|permission|couldn't list|unable to list"
    forbiddenPatterns:
      - "I can't create the epic|blocked|impossible to create"
  assert:
    - type: javascript
      value: file://asserts/tool-order.mjs
    - type: javascript
      value: file://asserts/required-patterns.mjs
    - type: javascript
      value: file://asserts/forbidden-patterns.mjs

- description: "FM-21 RF collision: another round introduced RF-03 in parallel — renumber to RF-04 and record it in deviations.md"
  vars:
    fixture: fixtures/github/triagem-limpa.json
    repo: fixtures/repo/rodada-paralela-rf.json
    modules: ["journeys/j3-stage1.md"]
    persona: stage-1
    entry: "Register the round's new requirement in the living PRD: scheduled report export. In the round scope it was RF-03."
    patternScope: files
    requiredPatterns:
      - "RF-04"
      - "collision|renumber"
    forbiddenPatterns:
      - "RF-03 — Scheduled export"
  assert:
    - type: javascript
      value: file://asserts/required-patterns.mjs
    - type: javascript
      value: file://asserts/forbidden-patterns.mjs

- description: "FM-12 orphan worktree: final review lists leftovers (git worktree list as evidence) and handles the orphan before the verdict"
  vars:
    fixture: fixtures/github/reconciliacao-worktree-orfa.json
    repo: fixtures/repo/rodada-aberta.json
    modules: ["journeys/j5-stage3.md"]
    persona: stage-3
    entry: "Let's do the final review of round R02 (#27)."
    expectedCallOrder:
      - "exec:.*git worktree list"
    requiredPatterns:
      - "worktree"
      - "orphan|leftover|residual"
      - "remov|prune|clean"
    forbiddenPatterns:
      - "no worktree|no leftover worktrees"
    hardFail: ["evidence-before-verdict"]
  assert:
    - type: javascript
      value: file://asserts/tool-order.mjs
    - type: javascript
      value: file://asserts/required-patterns.mjs
    - type: javascript
      value: file://asserts/forbidden-patterns.mjs
    - type: javascript
      value: file://asserts/hard-fail.mjs
