# Dry-run — plumbing proof with the mock model (MAESTRA_EVAL_MOCK=1).
# Validates provider + stub tools + fixtures + asserts WITHOUT a live model.

- description: "DRY J2: mock calls status→digest and produces a falseable summary (intact pipeline)"
  vars:
    fixture: fixtures/github/epic-labels-contraditorias.json
    repo: fixtures/repo/rodada-aberta.json
    modules: ["journeys/j2-resume.md"]
    mock: true
    entry: "12"
    mockSteps:
      - toolCall: { name: "maestra_status", args: {} }
      - toolCall: { name: "maestra_issue_digest", args: { issue: 12 } }
      - text: "I read the state from the platform: epic #12, Condensed variant, round R02 (report export). The signals are conflicting: the metadata says Stage 1, but the Stage 1 and Stage 2 tasks are all closed — by structure, it's in Stage 3. The final review is pending (#27). Next step: @joao runs the reconciliation. Correct?"
    expectedCallOrder:
      - "tool:maestra_status"
      - "tool:maestra_issue_digest"
    requiredPatterns:
      - "Stage 3"
  assert:
    - type: javascript
      value: file://asserts/tool-order.mjs
    - type: javascript
      value: file://asserts/required-patterns.mjs
    - type: javascript
      value: file://asserts/falseable-summary.mjs

- description: "DRY J8: mock emits event E with the structural refusal (pipeline + format)"
  vars:
    fixture: fixtures/github/epic-etapa3-execucao.json
    repo: fixtures/repo/rodada-aberta.json
    modules: ["journeys/j5-stage3.md", "journeys/j8-guard.md"]
    mock: true
    entry: "Add Excel export to #24, real quick."
    mockSteps:
      - toolCall: { name: "maestra_status", args: {} }
      - toolCall: { name: "maestra_emit_event", args: { epic: 12, type: "E", payload: { demand_created: "pending" } } }
      - text: "Good idea — and that's exactly why it can't enter through here: if I implement it now, it disappears from traceability. Registered, it doesn't get lost. I'll open the new demand now (takes 2 minutes, you just confirm the description) and this task continues with its original scope. Shall I open the demand?"
    expectEvent: "E"
  assert:
    - type: javascript
      value: file://asserts/refusal-structure.mjs
    - type: javascript
      value: file://asserts/event-emitted.mjs
