# T4 — J2 resume, contradiction (B2), PO persona (contradiction named, not glossed).
- description: "R02 T4: J2 contradiction (B2) — conflict named falsifiably, round anchor, next action with issue"
  vars:
    fixture: fixtures/github/epic-labels-contraditorias.json
    repo: fixtures/repo/rodada-aberta.json
    modules: ["journeys/j2-resume.md"]
    entry: "12"
    mock: true
    substate: "in-artifacts"
    requiredPatterns:
      - "[Cc]onflict|[Cc]ontradict|signals"
    mockSteps:
      - toolCall: { name: "maestra_status", args: {} }
      - toolCall: { name: "maestra_issue_digest", args: { issue: 12 } }
      - text: "The signals conflict here — the metadata reads Stage 1, but all Stage 1 and Stage 2 tasks are closed. By structure we're in Stage 3 of the report-export round (R02). The final review is still pending (#27). Correct me if I'm wrong."
    forbiddenPatterns:
      - "variant.*stage.*substate"
      - "substate\\s*[:=]"
  assert:
    - type: javascript
      value: file://asserts/no-field-enumeration.mjs
    - type: javascript
      value: file://asserts/required-patterns.mjs
    - type: javascript
      value: file://asserts/falseable-summary.mjs
    - type: javascript
      value: file://asserts/round-anchor-spoken.mjs
    - type: javascript
      value: file://asserts/unblock-when-paused.mjs

