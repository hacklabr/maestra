# R02 — welcoming-language non-regression (ADR-001 MUDANÇA 5).
# Golden inputs T1–T5 pin the post-refactor behaviour: natural speech that
# preserves the load-bearing contract (next-action+issue, unblock, round anchor,
# approval gate) WITHOUT enumerating the flow's internal field names.
#
# These are mock-driven (vars.mock) so the PR gate stays GREEN regardless of
# whether task #7 (the instruction refactor) has landed — the golden speech is
# what the model must produce AFTER the refactor. Live-model verification of
# #7 is a separate concern (npm run eval, once #7 merges).

# T1 — J2 resume, awaiting-assessment, PO persona.
- description: "R02 T1: J2 awaiting-assessment — natural speech, round anchor, next action with issue, no field enumeration"
  vars:
    fixture: fixtures/github/r02-awaiting-assessment.json
    repo: fixtures/repo/rodada-aberta.json
    modules: ["journeys/j2-resume.md"]
    entry: "12"
    mock: true
    substate: "awaiting-assessment"
    mockSteps:
      - toolCall: { name: "maestra_status", args: {} }
      - toolCall: { name: "maestra_issue_digest", args: { issue: 12 } }
      - text: "We're in the report-export round (R02): discovery and scope are done — two of two closed — and Engineering is now looking at whether it's viable. Next is the feasibility assessment (#16). Correct?"
    forbiddenPatterns:
      - "variant.*stage.*substate"
      - "substate\\s*[:=]"
  assert:
    - type: javascript
      value: file://asserts/no-field-enumeration.mjs
    - type: javascript
      value: file://asserts/falseable-summary.mjs
    - type: javascript
      value: file://asserts/round-anchor-spoken.mjs
    - type: javascript
      value: file://asserts/unblock-when-paused.mjs

