- description: "Completa — fatia do funil: gate da Etapa 1 (6/6 artefatos) verificado → onda da Etapa 2 criada após confirmação P7"
  vars:
    fixture: fixtures/github/epic-completa.json
    repo: fixtures/repo/rodada-aberta.json
