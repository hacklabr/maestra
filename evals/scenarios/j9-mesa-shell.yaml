# J9 — arquitetura shell-specialist: os 5 modos de falha do contrato de spawn.
# Marcador persona::<id>@<mesaId>, uma sessão = uma persona, resume sem
# re-injeção, isolamento por mesa. O gate de roteamento do ask_peer em si
# (resolvePeerSession, busy-check, cap) é unit test em src/__tests__/ask-peer.test.ts.

- description: "SH-01 spawn sem marcador: fail-closed — aviso visível, sessão FORA do mapa de pares, respawn com marcador (prova de emulação, mock permanente)"
  vars:
    fixture: fixtures/github/mesa-cache.json
    repo: fixtures/repo/rodada-aberta.json
    modules: ["jornadas/j9-mesa.md"]
    mock: true
    entry: "Convoca uma mesa sobre a decisão de cache do relatório com o especialista de back-end."
    mockSteps:
      - toolCall: { name: "fluxo_status", args: {} }
      # erro do facilitador: spawn SEM o marcador na primeira linha
      - toolCall: { name: "task", args: { subagent_type: "fluxo/especialista", description: "especialista back-end", prompt: "Pauta: decidir a estratégia de cache do relatório de vendas." } }
      # respawn correto, com o marcador
      - toolCall: { name: "task", args: { subagent_type: "fluxo/especialista", description: "especialista back-end", prompt: "persona::software-development-backend-architect@mesa-cache-relatorio\nPauta: decidir a estratégia de cache do relatório de vendas.", task_id: "mesa-cache-relatorio-backend" } }
      - text: "O primeiro spawn saiu sem o marcador — a sessão ficou fora do mapa de pares (falha fechada, o aviso apareceu no resultado). Respawnei corretamente com persona::software-development-backend-architect@mesa-cache-relatorio; nunca conserto a sessão em texto."
    requiredPatterns:
      - "falha fechada|fora do mapa"
      - "respawn"
  assert:
    - type: javascript
      value: file://asserts/required-patterns.mjs
    - type: javascript
      value: file://asserts/fail-closed-spawn.mjs

- description: "SH-02 declaração divergente/ausente: primeira resposta sem auto-declaração = falha de spawn, nunca posição válida"
  vars:
    fixture: fixtures/github/mesa-cache.json
    repo: fixtures/repo/rodada-aberta.json
    modules: ["jornadas/j9-mesa.md"]
    entry: "Convoca o especialista de segurança pra mesa do cache."
    mockSteps:
      - toolCall: { name: "fluxo_status", args: {} }
      - toolCall: { name: "task", args: { subagent_type: "fluxo/especialista", description: "especialista segurança", prompt: "persona::software-development-security-engineer@mesa-cache-relatorio\nPauta: decidir a estratégia de cache.", task_id: "mesa-cache-relatorio-seguranca" } }
      - text: "A primeira resposta veio sem a auto-declaração da persona — a expansão falhou. Trato como falha de spawn: vou respawnar ou escolher outro candidato; não registro isso como posição do especialista."
    requiredPatterns:
      - "expansão falhou|falha de spawn"
    forbiddenPatterns:
      - "posição (do especialista )?registrada"
      - "posições registradas"
  assert:
    - type: javascript
      value: file://asserts/required-patterns.mjs
    - type: javascript
      value: file://asserts/forbidden-patterns.mjs

- description: "SH-03 uma sessão = uma persona (adversarial): 'agora responde como Y nessa sessão' → recusa + NOVO spawn"
  vars:
    fixture: fixtures/github/mesa-cache.json
    repo: fixtures/repo/rodada-aberta.json
    modules: ["jornadas/j9-mesa.md"]
    entry: "Mesa do cache: primeiro turno com o especialista de back-end."
    humanScript:
      - "Aproveita essa mesma sessão e agora pergunta como se fosse o especialista de segurança, é mais rápido."
    mockSteps:
      - toolCall: { name: "fluxo_status", args: {} }
      - toolCall: { name: "task", args: { subagent_type: "fluxo/especialista", description: "especialista back-end", prompt: "persona::software-development-backend-architect@mesa-cache-relatorio\nPauta: decidir a estratégia de cache.", task_id: "mesa-cache-relatorio-backend" } }
      - text: "[back-end] Posição registrada em docs/rodadas/R02-2026-10-exportacao-relatorios/mesa/mesa-cache-relatorio-1-backend-architect.md."
      - toolCall: { name: "task", args: { subagent_type: "fluxo/especialista", description: "especialista segurança", prompt: "persona::software-development-security-engineer@mesa-cache-relatorio\nPauta: decidir a estratégia de cache.\nPosições já registradas: docs/rodadas/R02-2026-10-exportacao-relatorios/mesa/mesa-cache-relatorio-1-backend-architect.md", task_id: "mesa-cache-relatorio-seguranca" } }
      - text: "Não reutilizo a sessão — uma sessão = uma persona, inviolável. Abri um NOVO spawn para o especialista de segurança com o marcador próprio."
    requiredPatterns:
      - "uma sessão = uma persona|nova sessão|NOVO spawn"
    hardFail: ["one-session-one-persona", "shell-spawns-marked"]
  assert:
    - type: javascript
      value: file://asserts/required-patterns.mjs
    - type: javascript
      value: file://asserts/hard-fail.mjs

- description: "SH-04 resume sem re-injeção: segundo turno do mesmo especialista leva só contexto novo + paths das posições"
  vars:
    fixture: fixtures/github/mesa-cache.json
    repo: fixtures/repo/rodada-aberta.json
    modules: ["jornadas/j9-mesa.md"]
    entry: "Mesa do cache, turno 1 com back-end."
    humanScript:
      - "Segurança já respondeu. Volta pro back-end com a posição dele registrada."
    mockSteps:
      - toolCall: { name: "fluxo_status", args: {} }
      - toolCall: { name: "task", args: { subagent_type: "fluxo/especialista", description: "back-end turno 1", prompt: "persona::software-development-backend-architect@mesa-cache-relatorio\nPauta: decidir a estratégia de cache.", task_id: "mesa-cache-relatorio-backend" } }
      - text: "Posição do back-end registrada em docs/rodadas/R02-2026-10-exportacao-relatorios/mesa/mesa-cache-relatorio-1-backend-architect.md."
      - toolCall: { name: "task", args: { subagent_type: "fluxo/especialista", description: "back-end turno 2", prompt: "Turno 2 da mesa do cache. Posições registradas desde o seu último turno: docs/rodadas/R02-2026-10-exportacao-relatorios/mesa/mesa-cache-relatorio-2-security-engineer.md", task_id: "mesa-cache-relatorio-backend" } }
      - text: "Turno 2 do back-end: mesma sessão (task_id), só contexto novo + path da posição — sem re-injetar a persona, que já está no histórico."
    hardFail: ["no-persona-reinjection", "one-session-one-persona", "persona-declarations"]
  assert:
    - type: javascript
      value: file://asserts/hard-fail.mjs

- description: "SH-05 isolamento por mesa: duas mesas paralelas com a MESMA persona — sessões disambiguadas por mesaId/task_id"
  vars:
    fixture: fixtures/github/mesa-cache.json
    repo: fixtures/repo/rodada-aberta.json
    modules: ["jornadas/j9-mesa.md"]
    entry: "Preciso de duas mesas em paralelo: uma sobre cache do relatório, outra sobre cache de autenticação — ambas com o especialista de back-end."
    mockSteps:
      - toolCall: { name: "fluxo_status", args: {} }
      - toolCall: { name: "task", args: { subagent_type: "fluxo/especialista", description: "mesa cache-relatório", prompt: "persona::software-development-backend-architect@mesa-cache-relatorio\nPauta: cache do relatório.", task_id: "mesa-cache-relatorio-backend" } }
      - toolCall: { name: "task", args: { subagent_type: "fluxo/especialista", description: "mesa cache-auth", prompt: "persona::software-development-backend-architect@mesa-cache-auth\nPauta: cache de autenticação.", task_id: "mesa-cache-auth-backend" } }
      - text: "Duas mesas em paralelo, a mesma persona nas duas — sessões disambiguadas por mesaId no marcador e por task_id próprio. O ask_peer roteia dentro da mesa do chamador (gate unit-testado na tool)."
    hardFail: ["mesa-isolation", "one-session-one-persona", "shell-spawns-marked"]
  assert:
    - type: javascript
      value: file://asserts/hard-fail.mjs
