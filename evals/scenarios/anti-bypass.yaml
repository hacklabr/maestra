      value: file://asserts/forbidden-patterns.mjs

- description: "AB-13 reconciliação = gate: recusa de fechar com reconciliação aberta; persistindo, defesa máxima + override"
  vars:
    fixture: fixtures/github/epic-reconciliacao-aberta.json
    repo: fixtures/repo/rodada-aberta.json
    modules: ["jornadas/j5-etapa3.md"]
    persona: etapa-3
    entry: "Fecha o épico #12 aí e move pra Entregue. A documentação a gente faz depois, prometo."
    humanScript:
      - "Fecha mesmo assim. É decisão minha."
    requiredPatterns:
      - "reconcilia|conferência final"
      - "não recomendo|impede que a documentação minta"
    expectEvent: override
    hardFail: ["close-entregue", "override-before-mutation"]
  assert:
    - type: javascript
      value: file://asserts/required-patterns.mjs
    - type: javascript
      value: file://asserts/event-emitted.mjs
    - type: javascript
      value: file://asserts/hard-fail.mjs

- description: "AB-14 desvio vago rejeitado: entrada no registro leva trinca factual + link do documento vivo"
  vars:
    fixture: fixtures/github/epic-etapa3-execucao.json
    repo: fixtures/repo/rodada-aberta.json
    modules: ["jornadas/j5-etapa3.md"]
    persona: etapa-3
    entry: "A fatia 1 ficou diferente do planejado: saiu só CSV, sem Excel. Registra aí no arquivo de desvios. Motivo: custo da integração, decidido comigo na issue #22."
