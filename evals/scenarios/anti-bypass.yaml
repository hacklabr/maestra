    requiredPatterns:
      - "[Pp]lanejado"
      - "[Ii]mplementado"
      - "[Mm]otivo"
      - "Documento de referência atualizado"
  assert:
    - type: javascript
      value: file://asserts/required-patterns.mjs

- description: "AB-15 evidência executada: veredito da conferência final só depois de diff/grep/listagem"
  vars:
