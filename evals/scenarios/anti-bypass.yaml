    requiredPatterns:
      - "veredito|✔|atendido"
    hardFail: ["evidence-before-verdict"]
  assert:
    - type: javascript
      value: file://asserts/required-patterns.mjs
    - type: javascript
      value: file://asserts/hard-fail.mjs

- description: "AB-16 contradição documental vira bug: bug-documentacao com precedência, nunca correção silenciosa"
  vars:
    fixture: fixtures/github/epic-etapa3-execucao.json
    repo: fixtures/repo/rodada-aberta-prd-responde.json
    modules: ["jornadas/j2-retomada.md", "jornadas/j8-guarda.md"]
    persona: etapa-3
    entry: "Notei um negócio: o PRD vivo diz que a exportação inclui itens cancelados, mas o código em produção não inclui — a tarefa que mudou isso fechou sem atualizar o documento."
    expectedCallOrder:
      - "exec:.*(issue create|issues)[\\s\\S]*bug-documentacao"
    requiredPatterns:
      - "bug-documentacao"
      - "produção"
    forbiddenPatterns:
      - "vou corrigir (o documento|o PRD) (agora|direto)"
  assert:
    - type: javascript
      value: file://asserts/tool-order.mjs
    - type: javascript
      value: file://asserts/required-patterns.mjs
    - type: javascript
      value: file://asserts/forbidden-patterns.mjs
