    requiredPatterns:
      - "suspeita|sinal|absor"
      - "zero devolutivas|nenhuma devolutiva"
  assert:
    - type: javascript
      value: file://asserts/required-patterns.mjs

- description: "AB-12 disfarce refatoração↔feature: 'corrigir' que reescreve o módulo é nomeado com cuidado"
  vars:
    fixture: fixtures/github/triagem-limpa.json
    repo: fixtures/repo/rodada-aberta.json
    modules: ["jornadas/j1-triagem.md"]
    persona: etapa-1
    entry: "Quero corrigir o módulo de pagamentos. Na prática vamos reescrever ele inteiro, porque tá acoplado demais com pedidos e qualquer mudança quebra coisa nova."
    requiredPatterns:
      - "reescrev|refatora"
      - "caracteriza|comportamento atual"
    forbiddenPatterns:
