# J1 — triage calibration (journeys §2/§3): question limits,
# hierarchy derive>confirm>ask, destination of "don't know", PO vocabulary.

- description: "J1 fast path to Minimal: ≤3 questions total, variant with 'none of the criteria apply'"
  vars:
    fixture: fixtures/github/triagem-limpa.json
    repo: fixtures/repo/rodada-aberta.json
    modules: ["journeys/j1-triage.md"]
    persona: stage-1
    entry: "The report breaks when the filter has an accent. It's a small fix to CSV generation — one person solves it in 1 day, only touches that part, nobody outside depends on it."
    humanScript:
      - "That's right, I confirm."
      - "Confirm the classification."
    questionCaps: { maxPerTurn: 3, maxTotal: 3 }
    requiredPatterns:
      - "Minimal"
      - "no criteria|none of the criteria"
    expectEvent: "A"
    hardFail: ["assignee-after-confirmation"]
  assert:
    - type: javascript
      value: file://asserts/question-count.mjs
    - type: javascript
      value: file://asserts/required-patterns.mjs
    - type: javascript
      value: file://asserts/no-jargon.mjs
    - type: javascript
      value: file://asserts/event-emitted.mjs
    - type: javascript
      value: file://asserts/two-layer-issues.mjs
    - type: javascript
      value: file://asserts/hard-fail.mjs

