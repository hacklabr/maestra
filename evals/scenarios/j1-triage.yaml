    - type: javascript
      value: file://asserts/two-layer-issues.mjs
    - type: javascript
      value: file://asserts/hard-fail.mjs

- description: "J1 PO is never asked about engineering criteria (golden rule)"
  vars:
    fixture: fixtures/github/triagem-limpa.json
    repo: fixtures/repo/rodada-aberta.json
    modules: ["journeys/j1-triage.md"]
    persona: stage-1
    entry: "I want a new report of sales by period, with export. About 2 weeks of work."
    humanScript:
      - "I confirm."
    questionCaps: { maxPerTurn: 3, maxTotal: 5 }
    forbiddenPatterns:
      - "data model"
      - "API contract"
      - "hooks?"
      - "lasting technical decision"
      - "schema"
      - "\\bADR\\b"
      - "\\bDoR\\b"
      - "\\bTDD\\b"
  assert:
    - type: javascript
      value: file://asserts/forbidden-patterns.mjs
    - type: javascript
      value: file://asserts/question-count.mjs
    - type: javascript
      value: file://asserts/no-jargon.mjs

- description: "J1 vague demand: 1 focal question; after 2 rounds, Minimal as hypothesis + ambiguity in the human's own words"
  vars:
    fixture: fixtures/github/triagem-limpa.json
    repo: fixtures/repo/rodada-aberta.json
    modules: ["journeys/j1-triage.md"]
    persona: stage-1
    entry: "I need to improve the reports."
    humanScript:
      - "I don't know, just make it better, you know?"
      - "I can't tell you what's bad."
    questionCaps: { maxPerTurn: 3, maxTotal: 3 }
    requiredPatterns:
      - "Minimal"
      - "original description|in your (own )?words|recorded"
  assert:
    - type: javascript
      value: file://asserts/question-count.mjs
    - type: javascript
      value: file://asserts/required-patterns.mjs
    - type: javascript
      value: file://asserts/no-jargon.mjs

- description: "J1 'don't know' on a product criterion: safest hypothesis + recorded assumption + event C"
  vars:
    fixture: fixtures/github/triagem-limpa.json
    repo: fixtures/repo/rodada-aberta.json
    modules: ["journeys/j1-triage.md"]
    persona: stage-1
    entry: "I want a new filter by salesperson on the sales report."
    humanScript:
      - "I don't know if anyone uses that report today."
      - "I really don't know."
    requiredPatterns:
      - "assum|assuming"
      - "reclassif"
    expectEvent: "C"
  assert:
    - type: javascript
      value: file://asserts/required-patterns.mjs
    - type: javascript
      value: file://asserts/event-emitted.mjs
    - type: javascript
      value: file://asserts/no-jargon.mjs

- description: "J1 dedup (G-10): searches similar open epics BEFORE creating"
  vars:
    fixture: fixtures/github/triagem-limpa.json
    repo: fixtures/repo/rodada-aberta.json
    modules: ["journeys/j1-triage.md"]
    persona: stage-1
    entry: "Add CSV report export."
    humanScript:
      - "I confirm."
    expectedCallOrder:
      - "exec:.*(issue list|search issues)"
      - "exec:.*issue create"
